<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Elegant Dark Gradient Background -->
  <defs>
    <linearGradient id="bg-anniv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="50%" stop-color="#fcf6ba" />
      <stop offset="100%" stop-color="#b38728" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-anniv)" />

  <!-- Decorative Borders -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="url(#gold-text)" stroke-width="4" rx="15" />
  <rect x="50" y="50" width="1100" height="530" fill="none" stroke="url(#gold-text)" stroke-width="1" rx="10" opacity="0.6" />

  <!-- Main Content -->
  <text x="600" y="240" font-family="'Times New Roman', serif" font-size="80" font-weight="bold" fill="url(#gold-text)" text-anchor="middle">
    Happy {{occasion}},
  </text>
  <text x="600" y="340" font-family="'Times New Roman', serif" font-size="70" font-weight="bold" fill="#ffffff" text-anchor="middle">
    {{name}}
  </text>

  <!-- Message area -->
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="36" fill="#cccccc" text-anchor="middle">
    {{message}}
  </text>

  <!-- Date area -->
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="24" fill="url(#gold-text)" text-anchor="middle" letter-spacing="4">
    {{date}}
  </text>
</svg>
