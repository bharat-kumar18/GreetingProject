<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <text x="600" y="170" text-anchor="middle" font-family="Arial" font-size="52" font-weight="700" fill="#0f766e">{{occasion}}</text>
  <text x="600" y="300" text-anchor="middle" font-family="Arial" font-size="74" font-weight="700" fill="#111827">{{name}}</text>
  <text x="600" y="410" text-anchor="middle" font-family="Arial" font-size="30" fill="#334155">{{message}}</text>
  <text x="600" y="490" text-anchor="middle" font-family="Arial" font-size="24" fill="#64748b">{{date}}</text>
</svg>
