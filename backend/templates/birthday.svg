<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Dynamic Gradient Background -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="100%" stop-color="#fecfef" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Confetti Graphics -->
  <circle cx="100" cy="150" r="15" fill="#f6d365" />
  <circle cx="1050" cy="80" r="25" fill="#fda085" />
  <polygon points="1100,500 1120,540 1080,540" fill="#a1c4fd" />
  <polygon points="150,550 170,580 130,580" fill="#c2e9fb" />

  <!-- Main Content -->
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">
    Happy {{occasion}}, {{name}}!
  </text>

  <!-- Message area -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="40" fill="#4a4a4a" text-anchor="middle">
    {{message}}
  </text>

  <!-- Date area -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="28" font-style="italic" fill="#888888" text-anchor="middle">
    {{date}}
  </text>
</svg>
